<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Unidad pilosebácea 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: lámina anatómica a pantalla completa; panel de leyenda flotante a la izquierda (abajo en móvil) y ficha de estructura flotante */
/* Modo claro único (decisión del usuario): fondo blanco en cualquier tema del sistema */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --panel:rgba(255,255,255,.94);
  --ink:#1b2231;
  --ink-2:#4b566d;
  --line:#d6dce5;
  --accent:#b02c47;
  --chip:#f1f3f7;
  --halo:#ffffff;
  --ok:#23804a;
  --ok-bg:#e5f3ea;
  --bad-bg:#fbe7eb;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--bg);
  color:var(--ink);font-family:var(--body);overflow-x:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
/* altura propia: el visor puede ajustar el marco al contenido, así que el modelo no debe depender de position:fixed */
#app{position:relative;height:100vh;height:100dvh;min-height:600px;overflow:hidden;
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)))}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#markers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#leaders .halo{stroke:var(--halo);stroke-width:4;stroke-linecap:round;opacity:.85}
#leaders .ld{stroke:var(--ink);stroke-width:1.3;stroke-linecap:round}
#leaders .ld.on{stroke:var(--accent);stroke-width:1.6}
.mk{
  position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  border:1.5px solid #fff;background:#1b2231;color:#fff;font:500 10px/17px var(--mono);text-align:center;
  pointer-events:auto;cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.35);
  transition:scale .15s, background .15s;
}
.mk:hover,.mk:focus-visible{scale:1.25;background:var(--accent);outline:none}
.mk.on{background:var(--accent);scale:1.3}
.seg{
  position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;
  font:italic 600 14px/1 var(--display);color:var(--ink);transform:translate(-100%,-50%);padding-right:16px;
  text-shadow:0 0 2px var(--halo),0 0 2px var(--halo),0 0 4px var(--halo),0 0 6px var(--halo);
}
.seg.segR{transform:translate(0,-50%);padding-right:0;padding-left:16px;
}
#toolbar{
  position:absolute;z-index:3;top:max(16px, env(safe-area-inset-top, 0px));left:max(16px, env(safe-area-inset-left, 0px));
  right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;
}
.tb{
  pointer-events:auto;display:flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 10px;
  font:500 12.5px/1 var(--body);color:var(--ink);background:var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:999px;cursor:pointer;
}
.tb.icon{width:36px;padding:0;justify-content:center}
#bQuiz{order:10;margin-left:auto} /* separado del resto, en el lado derecho */
.tb:hover{border-color:var(--ink-2)}
.tb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tb svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-pressed="true"],.tb[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#panel{
  position:absolute;top:calc(max(16px, env(safe-area-inset-top, 0px)) + 46px);left:max(16px, env(safe-area-inset-left, 0px));
  bottom:max(16px, env(safe-area-inset-bottom, 0px));width:230px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:16px 13px 12px;overflow:hidden;
}
.eyebrow{margin:0;font:500 11px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:4px 0 0;font:600 21px/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
.lede{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.controls{display:flex;flex-wrap:wrap;gap:6px}
.controls button{
  font:500 12px/1 var(--body);color:var(--ink);background:var(--chip);border:1px solid var(--line);
  border-radius:999px;padding:7px 11px;cursor:pointer;
}
.controls button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls button:focus-visible,.lg:focus-visible,#iClose:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#legend{flex:1;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;border-top:1px solid var(--line)}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 4px}
.gt{font:500 10.5px/1 var(--body);color:var(--ink-2);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 9px;cursor:pointer}
.gt:hover{color:var(--ink);border-color:var(--ink-2)}
.gt[aria-pressed="false"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lg.off{opacity:.45}
#legend h3{margin:0;font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.lg{
  display:grid;grid-template-columns:22px 12px 1fr;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-radius:6px;padding:5px 6px;font:400 13.5px/1.25 var(--body);color:var(--ink);cursor:pointer;
}
.lg:hover{background:var(--chip)}
.lg.on{background:var(--chip);box-shadow:inset 2px 0 0 var(--accent)}
.lg .n{font:500 11px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.lg .sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.hint{margin:0;font-size:11.5px;line-height:1.45;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
#info{
  position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));
  width:min(360px, calc(100% - 32px));background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:16px 18px 16px;
}
#info h2{margin:4px 28px 6px 0;font:600 22px/1.15 var(--display);text-wrap:balance}
#info p.d{margin:0;font-size:13.5px;line-height:1.55;max-width:60ch}
#iClose{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:400 16px/1 var(--body);cursor:pointer}
#tip{
  position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--bg);
  font:500 12px/1 var(--body);padding:6px 8px;border-radius:5px;white-space:nowrap;transform:translate(12px,12px);
}
#nameBox{
  position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));
  max-width:calc(100% - 32px);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:12px 18px;font:600 21px/1.2 var(--display);color:var(--ink);
  pointer-events:none;
}
#quiz{
  position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));
  width:min(330px, calc(100% - 32px));box-sizing:border-box;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;
}
#quiz h2{margin:0;font:600 19px/1.25 var(--display);text-wrap:balance}
#quiz h2 .qn{display:inline-block;min-width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font:500 12px/24px var(--mono);text-align:center;vertical-align:2px}
#qOpts{display:grid;gap:6px}
#qOpts button{
  text-align:left;font:400 14px/1.3 var(--body);color:var(--ink);background:var(--chip);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;cursor:pointer;
}
#qOpts button:hover:not(:disabled){border-color:var(--ink-2)}
#qOpts button:disabled{cursor:default}
#qOpts button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
#qOpts button.bad{background:var(--bad-bg);border-color:var(--accent)}
#qFb{margin:0;font-size:13.5px;line-height:1.4;color:var(--ink-2);min-height:1.4em}
#qFb.ok{color:var(--ok)} #qFb.bad{color:var(--accent)}
.qbtns{display:flex;gap:8px;justify-content:flex-end}
.qbtns button{font:500 13px/1 var(--body);border-radius:999px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
#qNext{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#quiz button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.quiz .seg{visibility:hidden}
.tb:disabled{opacity:.4;cursor:not-allowed}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
@media (max-width:760px){
  #panel{top:auto;left:max(10px, env(safe-area-inset-left, 0px));right:max(10px, env(safe-area-inset-right, 0px));
    bottom:max(10px, env(safe-area-inset-bottom, 0px));width:auto;height:40%;padding:14px 14px 10px;gap:10px}
  h1{font-size:24px}
  .lede{display:none}
  .hint{display:none}
  #quiz{right:max(10px, env(safe-area-inset-right, 0px));bottom:max(10px, env(safe-area-inset-bottom, 0px));width:auto;left:max(10px, env(safe-area-inset-left, 0px));padding:12px;gap:8px}
  #quiz h2{font-size:17px}
  #qOpts{grid-template-columns:1fr 1fr}
  #qOpts button{padding:8px 10px;font-size:13px}
  #nameBox{bottom:auto;top:calc(max(10px, env(safe-area-inset-top, 0px)) + 46px);right:max(10px, env(safe-area-inset-right, 0px));font-size:18px;padding:10px 14px}
  #toolbar{top:max(10px, env(safe-area-inset-top, 0px));left:max(10px, env(safe-area-inset-left, 0px));right:max(10px, env(safe-area-inset-right, 0px))}
  .tb{width:36px;padding:0;justify-content:center}
  .tb span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #info{top:calc(max(10px, env(safe-area-inset-top, 0px)) + 44px);bottom:auto;right:max(10px, env(safe-area-inset-right, 0px));width:auto;left:max(10px, env(safe-area-inset-left, 0px))}
  #info p.d{font-size:13px}
}
@media (prefers-reduced-motion: reduce){ .mk{transition:none} }
.mk{transition-property:scale,background}
</style>

<div id="app">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const canvas = $('#scene');
if (!window.THREE) { $('#app').insertAdjacentHTML('beforeend','<div id="err">No se pudo cargar el motor 3D. Recarga la página.</div>'); return; }

/* ---------- Datos de las estructuras ---------- */
const ITEMS = [
  {id:'tallo', g:'Segmentos del pelo', name:'Tallo', c:'#8a5a22', layer:'all', seg:[3.44,0.15],
   d:'Porción libre del pelo, por encima de la superficie cutánea. Es queratina sin vida y en el corte se distinguen sus tres capas concéntricas: cutícula, corteza y médula.'},
  {id:'infund', g:'Segmentos del pelo', name:'Infundíbulo', c:'#f1e3c0', layer:'fol', seg:[0.1,-1.3],
   d:'Tramo superior del folículo, desde el ostium hasta la desembocadura del conducto sebáceo. Su epitelio queratiniza como la epidermis; es el lugar donde se forman los comedones.'},
  {id:'raiz', g:'Segmentos del pelo', name:'Raíz', c:'#c99a45', layer:'fol', seg:[-1.3,-5.65],
   d:'Porción del pelo alojada en el folículo desde la altura del conducto sebáceo hasta el bulbo. Comprende el pelo en formación, el bulbo con la matriz y la papila, y las vainas radiculares interna, externa y conectiva.'},

  {id:'cuticula', g:'Capas del pelo', name:'Cutícula', c:'#0d0b0a', layer:'cut',
   d:'Capa más externa del tallo: de 6 a 10 hileras de células planas imbricadas como tejas, con el borde libre hacia la punta. Protege la corteza, ancla el pelo a la cutícula de la vaina interna y le da brillo.'},
  {id:'corteza', g:'Capas del pelo', name:'Corteza', c:'#6a4116', layer:'cut',
   d:'La mayor parte del tallo. Células fusiformes queratinizadas llenas de macrofibrillas de queratina y gránulos de melanina, que determinan el color, la resistencia y la elasticidad del pelo.'},
  {id:'medula', g:'Capas del pelo', name:'Médula', c:'#efe3c4', layer:'cut',
   d:'Eje central de células poco compactas con espacios aéreos. Aparece en pelos terminales gruesos y suele ser discontinua hacia la punta; falta en el vello y en muchos pelos finos.'},
  {id:'bulbo', g:'Bulbo', name:'Bulbo', c:'#d8b25c', layer:'fol', ring:true,
   d:'Porción terminal engrosada de la raíz, con forma de cebolla, alojada en la dermis profunda o la hipodermis. Contiene la matriz germinativa y los melanocitos, y envuelve por su base a la papila dérmica.'},
  {id:'matriz', g:'Bulbo', name:'Matriz del pelo', c:'#ecd28e', layer:'fol',
   d:'Epitelio germinativo del bulbo, con altísima actividad mitótica, que rodea a la papila. Produce el tallo y la vaina radicular interna durante el anágeno.'},
  {id:'papila', g:'Bulbo', name:'Papila dérmica', c:'#e695a3', layer:'fol',
   d:'Invaginación de tejido conectivo en la base del bulbo. Sus fibroblastos especializados emiten las señales que inician y sostienen el ciclo del pelo; su volumen se relaciona con el grosor del tallo.'},
  {id:'capilares', g:'Bulbo', name:'Vasos de la papila', c:'#c8283c', layer:'fol',
   d:'Asas arteriolares (rojo) y venulares (azul) que ascienden desde el plexo vascular profundo hasta el interior de la papila para nutrir la matriz.'},

  {id:'irs', g:'Vainas foliculares', name:'Vaina radicular interna', c:'#e9cf6f', layer:'fol',
   d:'Capa queratinizada (capas de Henle, de Huxley y cutícula propia) que moldea el pelo y lo acompaña hasta cerca de la desembocadura del conducto sebáceo, donde se desintegra.'},
  {id:'ors', g:'Vainas foliculares', name:'Vaina radicular externa', c:'#7f93de', layer:'fol',
   d:'Epitelio continuo con la epidermis, rico en glucógeno en su tramo inferior. Reviste el folículo desde el ostium hasta el bulbo.'},
  {id:'ct', g:'Vainas foliculares', name:'Vaina conectiva', c:'#efe2e2', layer:'fol',
   d:'Envoltura dérmica externa del folículo, de tejido conectivo, que lo separa de la dermis que lo rodea.'}
];
ITEMS.forEach((it,i)=>it.n=i+1);
const BYID = Object.fromEntries(ITEMS.map(i=>[i.id,i]));

/* ---------- Renderizador y escena ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true}); }
catch(e){ $('#app').insertAdjacentHTML('beforeend','<div id="err">Este navegador no permite WebGL, necesario para el modelo 3D.</div>'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setClearColor(0x000000, 0);
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 300);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 45; controls.autoRotateSpeed = 0.7;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8fa0, 0.62));
const key = new THREE.DirectionalLight(0xffffff, 0.62); key.position.set(4, 7, 10); scene.add(key);
const rim = new THREE.DirectionalLight(0xfff1e6, 0.25); rim.position.set(-8, 3, -4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

const V = (x,y,z=0)=>new THREE.Vector3(x,y,z);
const clip = new THREE.Plane(V(0,0,-1), 0);       // corte sagital: conserva z <= 0
const surf = new THREE.Plane(V(0,-1,0), 0.15);    // recorta el folículo a ras de la superficie

/* ---------- Texturas procedurales ---------- */
let seed = 20261109;
const R = ()=> (seed = seed*16807 % 2147483647) / 2147483647;
const pick = a => a[Math.floor(R()*a.length)];
function tex(w,h,draw,rx=1,ry=1){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
function dotted(base,dot,count,r0,r1,a=1){
  return (g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h); g.fillStyle=dot;
    for(let i=0;i<count;i++){ g.globalAlpha=a*(0.35+0.65*R()); const r=r0+R()*(r1-r0);
      g.beginPath(); g.ellipse(R()*w,R()*h,r,r*(0.65+R()*0.5),R()*3,0,7); g.fill(); }
    g.globalAlpha=1; };

function slab(z0,z1,top,bot,m,showTop,showBot,isBack){
  const g=new THREE.BoxGeometry(1,1,1,110,1,30); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const x=X0+(p.getX(i)+.5)*(X1-X0), z=z0+(p.getZ(i)+.5)*(z1-z0);
    p.setXYZ(i,x,p.getY(i)>0?top(x,z):bot(x,z),z); }
  g.computeVertexNormals();
  let mats;
  if(isBack){ const cut=m.clone(); cut.depthWrite=false; cut.userData.cutFace=true;
    mats=[m,m,showTop?m:HIDE,showBot?m:HIDE,cut,m]; }
  else mats=[m,m,showTop?m:HIDE,showBot?m:HIDE,m,HIDE];
  const mesh=new THREE.Mesh(g,mats); mesh.renderOrder=-1; return mesh;
}

}

function taperTube(curve,rfn,tSeg,rSeg,colorFn,m){
  const fr=curve.computeFrenetFrames(tSeg,false), pos=[],nor=[],uv=[],col=[],idx=[], P=V(0,0), N=V(0,0), C=new THREE.Color();
  for(let i=0;i<=tSeg;i++){ const t=i/tSeg; curve.getPointAt(t,P); const r=rfn(t); colorFn(t,C);
    for(let j=0;j<=rSeg;j++){ const v=j/rSeg*Math.PI*2, s=Math.sin(v), c=-Math.cos(v);
      N.set(c*fr.normals[i].x+s*fr.binormals[i].x, c*fr.normals[i].y+s*fr.binormals[i].y, c*fr.normals[i].z+s*fr.binormals[i].z).normalize();
      pos.push(P.x+r*N.x,P.y+r*N.y,P.z+r*N.z); nor.push(N.x,N.y,N.z); uv.push(t,j/rSeg); col.push(C.r,C.g,C.b); } }
  for(let i=0;i<tSeg;i++) for(let j=0;j<rSeg;j++){ const a=i*(rSeg+1)+j, b=(i+1)*(rSeg+1)+j; idx.push(a,b,a+1,b,b+1,a+1); }
  const g=new THREE.BufferGeometry(); g.setIndex(idx);
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return new THREE.Mesh(g,m);
}

function pickAt(cx,cy){
  const r=canvas.getBoundingClientRect(); ptr.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(scene.children,true);
  let cutHit=null;
  for(const h of hits){
    const o=h.object; if(!o.isMesh || !o.userData.id || !shown(o)) continue;
    const m=Array.isArray(o.material)?o.material[h.face.materialIndex]:o.material;

    if(o.userData.clipped && state.cut && h.point.z>0.002) continue;
    if(o.userData.surf && h.point.y>0.16) continue;
    if(m && m.userData.cutFace){ if(!cutHit) cutHit=h; continue; }
    return BYID[o.userData.id] ? o.userData.id : null;
  }

}
/* ---------- Zoom hacia el cursor (pellizco en trackpad, rueda del ratón y gesto de Safari) ---------- */
// Se acerca o aleja manteniendo fijo el punto que hay bajo el cursor, en vez de hacerlo hacia el centro.
const zoomPlane=new THREE.Plane(), zoomHit=V(0,0,0), zoomDir=V(0,0,0);
function zoomAt(cx,cy,f){
  const r=canvas.getBoundingClientRect();
  ptr.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  camera.getWorldDirection(zoomDir);
  zoomPlane.setFromNormalAndCoplanarPoint(zoomDir, controls.target);
  if(!ray.ray.intersectPlane(zoomPlane, zoomHit)) return;
  const d=camera.position.distanceTo(controls.target);
  f=THREE.MathUtils.clamp(d*f, controls.minDistance, controls.maxDistance)/d;
  camera.position.sub(zoomHit).multiplyScalar(f).add(zoomHit);
  controls.target.sub(zoomHit).multiplyScalar(f).add(zoomHit);
  // Al alejar, el modelo se va recentrando poco a poco: al llegar a la distancia inicial queda centrado como al principio
  if(f>1){
    const dNew=d*f, t = dNew>=homeDist || homeDist<=d ? 1 : (dNew-d)/(homeDist-d);
    const shift=HOME_T.clone().sub(controls.target).multiplyScalar(t);
    controls.target.add(shift); camera.position.add(shift);
  }
  focusDelta.set(0,0,0); focusDist=0;
  controls.update();
}

  const unit = e.deltaMode===1 ? 16 : e.deltaMode===2 ? 400 : 1;
  const k = e.ctrlKey ? 0.012 : 0.0018;      // ctrlKey = pellizco del trackpad
  zoomAt(e.clientX, e.clientY, Math.exp(THREE.MathUtils.clamp(e.deltaY*unit,-200,200)*k));
},{capture:true,passive:false});

// Pantallas táctiles: el pellizco con dos dedos acerca hacia el punto medio entre los dedos y, al moverlos, desplaza la vista.
// Un dedo sigue girando el modelo con OrbitControls.
function planePoint(cx,cy,out){
  const r=canvas.getBoundingClientRect();
  ptr.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera); camera.getWorldDirection(zoomDir);
  zoomPlane.setFromNormalAndCoplanarPoint(zoomDir, controls.target);

}
const pinchInfo=e=>{ const a=e.touches[0], b=e.touches[1];
  return {x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2, d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1}; };

appEl.addEventListener('touchstart',e=>{

  setToggle('cut','#tCut',s.cut); setToggle('skin','#tSkin',s.skin); applyVis();
  Object.keys(s.groups).forEach(g=>setGroup(g,s.groups[g]));
  setPanel(s.panel,false);
  focusDelta.set(0,0,0); focusDist=0; camera.position.copy(s.cam); controls.target.copy(s.tgt); controls.update(); // vuelve a la vista de antes
}
qNext.addEventListener('click',()=>{
  if(quiz.done){ const s=quiz.saved; startQuiz(); quiz.saved=s; return; }
  quiz.i++; if(quiz.i>=quiz.list.length) result(); else ask();
});
$('#qExit').addEventListener('click',endQuiz);
bQuiz.addEventListener('click',()=>{ if(quiz) endQuiz(); else startQuiz(); });

/* ---------- Tema para líneas ---------- */
function themeLines(){ const cs=getComputedStyle(document.documentElement);
  const c=cs.getPropertyValue('--ink-2').trim()||'#4b566d', a=cs.getPropertyValue('--accent').trim()||'#b02c47';
  Object.keys(SEGS).forEach(id=>SEGS[id].material.color.set(state.sel===id?a:c)); }
themeLines();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeLines); }catch(e){}
new MutationObserver(themeLines).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- Bucle ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tmp=V(0,0,0);
function place(el,p,w,h){ tmp.copy(p).project(camera);
  if(tmp.z>1||tmp.x<-1.1||tmp.x>1.1||tmp.y<-1.1||tmp.y>1.1){ el.style.display='none'; return; }
  el.style.display='';
  if(el.classList.contains('mk')){ el.style.translate=((tmp.x+1)/2*w).toFixed(1)+'px '+((1-tmp.y)/2*h).toFixed(1)+'px'; return; }
  el.style.transform=(el.classList.contains('segR')?'translate(0,-50%) ':el.classList.contains('seg')?'translate(-100%,-50%) ':'')+'translate3d('+((tmp.x+1)/2*w).toFixed(1)+'px,'+((1-tmp.y)/2*h).toFixed(1)+'px,0)';
}
function proj(p,w,h){ tmp.copy(p).project(camera); if(tmp.z>1) return null; return {x:(tmp.x+1)/2*w, y:(1-tmp.y)/2*h}; }
function frame(t){
  if(focusDelta.lengthSq()>1e-6){ const step=focusDelta.clone().multiplyScalar(0.1); controls.target.add(step); camera.position.add(step); focusDelta.sub(step); }
  if(focusDist){ const off=camera.position.clone().sub(controls.target), d=off.length();
    if(Math.abs(d-focusDist)<0.05) focusDist=0; else camera.position.copy(controls.target).add(off.setLength(d+(focusDist-d)*0.1)); }
  controls.update();
  if(state.sel) setGlow(state.sel, reduce ? 0.4 : 0.32+0.16*Math.sin(t*0.005));
  renderer.render(scene,camera);
  const w=canvas.clientWidth, h=canvas.clientHeight;
  ITEMS.forEach(it=>{
    const on=labelOn(it);
    if(!it.ln){ if(!on){ it.mk.style.display='none'; return; } place(it.mk,ANCH[it.id],w,h); return; }
    const A=proj(ANCH[it.id],w,h), L=proj(LABP[it.id],w,h);
    if(!on||!A||!L){ it.mk.style.display='none'; it.ln.forEach(l=>l.style.display='none'); return; }
    it.mk.style.display=''; it.mk.style.translate=L.x.toFixed(1)+'px '+L.y.toFixed(1)+'px';
    const dx=A.x-L.x, dy=A.y-L.y, d=Math.hypot(dx,dy)||1, sx=L.x+dx/d*12, sy=L.y+dy/d*12;
    const sel=state.sel===it.id;
    it.ln.forEach((l,k)=>{ l.style.display=''; l.setAttribute('x1',sx.toFixed(1)); l.setAttribute('y1',sy.toFixed(1)); l.setAttribute('x2',A.x.toFixed(1)); l.setAttribute('y2',A.y.toFixed(1));
      if(k===1){ l.setAttribute('marker-end',sel?'url(#ahOn)':'url(#ah)'); l.classList.toggle('on',sel); } });
  });
  segLabels.forEach(s=>{ const on=labelOn(s.it); SEGS[s.it.id].visible=on; if(!on){ s.el.style.display='none'; return; } place(s.el,s.p,w,h); });
  requestAnimationFrame(frame);
}
applyVis(); resetView(); requestAnimationFrame(frame);
})();
</script>
